name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests + debug & release builds
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :core:test assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log; then
            # Surface compiler and test errors as one annotation, so they show on the run summary.
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|> .*failed|AssertionError|Exception" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi

      - name: Record Compose screenshots (Roborazzi)
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :app:recordRoborazziDebug --stacktrace 2>&1 | tee shots.log; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Exception|Caused by" shots.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Screenshots failed::${msg}"
            exit 1
          fi

      - name: Collect screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/build/outputs/roborazzi/*.png docs/screenshots/
          ls -la docs/screenshots

      - name: Upload APKs, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlinquest-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            docs/screenshots/*.png

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update screenshots [skip ci]"
            git push
          fi
